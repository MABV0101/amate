# Netlify · Amate

[build]
  command = "node build.js"
  publish = "_publicado"

[build.environment]
  NODE_VERSION = "20"

# El acervo y los estilos se cachean fuerte; el HTML nunca,
# para que la hoja del día siempre sea la correcta.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/acervo/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Direcciones antiguas: aquí se agregan redirecciones si alguna vez cambia
# una ruta. Nunca se borra una dirección publicada.
#
# CUIDADO al escribir reglas: un patrón que también coincide con su propio
# destino produce un bucle infinito (ERR_TOO_MANY_REDIRECTS). Aquí había una
# regla de ese tipo para las hojas de efeméride; se eliminó. Netlify ya
# resuelve solo las direcciones sin diagonal final, así que no hacía falta.
